<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Shading linear gradient for royal gold sheen -->
    <linearGradient id="gold-rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C7A76A" />
      <stop offset="30%" stop-color="#F5E3BE" />
      <stop offset="70%" stop-color="#DEC38C" />
      <stop offset="100%" stop-color="#A5864C" />
    </linearGradient>

    <linearGradient id="gold-petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4C0" />
      <stop offset="50%" stop-color="#DEC28A" />
      <stop offset="100%" stop-color="#9E8048" />
    </linearGradient>

    <!-- Single Greek Key Meander Block (20px wide, 18px high) -->
    <g id="greek-fret">
      <rect x="0" y="0" width="20" height="18" fill="none" stroke="#DEC28A" stroke-width="1.2" />
      <path d="M 3,15.5 H 17 V 2.5 H 3 V 13 H 14.5 V 5 H 5.5 V 10.5 H 12 V 7.5 H 8" fill="none" stroke="#E5CCA0" stroke-width="1.35" stroke-linecap="square" stroke-linejoin="miter" />
    </g>

    <!-- Flower Blossom (Center at x=120, y=60) -->
    <g id="blossom">
      <!-- Outer Petal Ring (12 layered scalloped petals) -->
      <!-- We generate 12 petals around circle r=14 -->
      <ellipse cx="133.00" cy="60.00" rx="5.5" ry="3.5" transform="rotate(0.0, 133.00, 60.00)" fill="url(#gold-petal)" stroke="#9B7D46" stroke-width="0.6" />
      <ellipse cx="131.26" cy="66.50" rx="5.5" ry="3.5" transform="rotate(30.0, 131.26, 66.50)" fill="url(#gold-petal)" stroke="#9B7D46" stroke-width="0.6" />
      <ellipse cx="126.50" cy="71.26" rx="5.5" ry="3.5" transform="rotate(60.0, 126.50, 71.26)" fill="url(#gold-petal)" stroke="#9B7D46" stroke-width="0.6" />
      <ellipse cx="120.00" cy="73.00" rx="5.5" ry="3.5" transform="rotate(90.0, 120.00, 73.00)" fill="url(#gold-petal)" stroke="#9B7D46" stroke-width="0.6" />
      <ellipse cx="113.50" cy="71.26" rx="5.5" ry="3.5" transform="rotate(120.0, 113.50, 71.26)" fill="url(#gold-petal)" stroke="#9B7D46" stroke-width="0.6" />
      <ellipse cx="108.74" cy="66.50" rx="5.5" ry="3.5" transform="rotate(150.0, 108.74, 66.50)" fill="url(#gold-petal)" stroke="#9B7D46" stroke-width="0.6" />
      <ellipse cx="107.00" cy="60.00" rx="5.5" ry="3.5" transform="rotate(180.0, 107.00, 60.00)" fill="url(#gold-petal)" stroke="#9B7D46" stroke-width="0.6" />
      <ellipse cx="108.74" cy="53.50" rx="5.5" ry="3.5" transform="rotate(210.0, 108.74, 53.50)" fill="url(#gold-petal)" stroke="#9B7D46" stroke-width="0.6" />
      <ellipse cx="113.50" cy="48.74" rx="5.5" ry="3.5" transform="rotate(240.0, 113.50, 48.74)" fill="url(#gold-petal)" stroke="#9B7D46" stroke-width="0.6" />
      <ellipse cx="120.00" cy="47.00" rx="5.5" ry="3.5" transform="rotate(270.0, 120.00, 47.00)" fill="url(#gold-petal)" stroke="#9B7D46" stroke-width="0.6" />
      <ellipse cx="126.50" cy="48.74" rx="5.5" ry="3.5" transform="rotate(300.0, 126.50, 48.74)" fill="url(#gold-petal)" stroke="#9B7D46" stroke-width="0.6" />
      <ellipse cx="131.26" cy="53.50" rx="5.5" ry="3.5" transform="rotate(330.0, 131.26, 53.50)" fill="url(#gold-petal)" stroke="#9B7D46" stroke-width="0.6" />
      <line x1="128.00" y1="60.00" x2="137.00" y2="60.00" stroke="#7E6230" stroke-width="0.6" />
      <line x1="126.93" y1="64.00" x2="134.72" y2="68.50" stroke="#7E6230" stroke-width="0.6" />
      <line x1="124.00" y1="66.93" x2="128.50" y2="74.72" stroke="#7E6230" stroke-width="0.6" />
      <line x1="120.00" y1="68.00" x2="120.00" y2="77.00" stroke="#7E6230" stroke-width="0.6" />
      <line x1="116.00" y1="66.93" x2="111.50" y2="74.72" stroke="#7E6230" stroke-width="0.6" />
      <line x1="113.07" y1="64.00" x2="105.28" y2="68.50" stroke="#7E6230" stroke-width="0.6" />
      <line x1="112.00" y1="60.00" x2="103.00" y2="60.00" stroke="#7E6230" stroke-width="0.6" />
      <line x1="113.07" y1="56.00" x2="105.28" y2="51.50" stroke="#7E6230" stroke-width="0.6" />
      <line x1="116.00" y1="53.07" x2="111.50" y2="45.28" stroke="#7E6230" stroke-width="0.6" />
      <line x1="120.00" y1="52.00" x2="120.00" y2="43.00" stroke="#7E6230" stroke-width="0.6" />
      <line x1="124.00" y1="53.07" x2="128.50" y2="45.28" stroke="#7E6230" stroke-width="0.6" />
      <line x1="126.93" y1="56.00" x2="134.72" y2="51.50" stroke="#7E6230" stroke-width="0.6" />
      <!-- Inner Rosette Center -->
      <circle cx="120" cy="60" r="8" fill="#D8BC84" stroke="#8F723B" stroke-width="0.9" />
      <circle cx="120" cy="60" r="5.5" fill="#141213" />
      <circle cx="120" cy="60" r="3.5" fill="#F4E2BE" />
      <circle cx="120" cy="60" r="1.5" fill="#8F723B" />
      <!-- Stippled core dots -->
      <circle cx="117" cy="58" r="0.7" fill="#F5E4C0" />
      <circle cx="123" cy="58" r="0.7" fill="#F5E4C0" />
      <circle cx="117" cy="62" r="0.7" fill="#F5E4C0" />
      <circle cx="123" cy="62" r="0.7" fill="#F5E4C0" />
    </g>

    <!-- Acanthus Leaf Plume Group (curving left and right from blossom) -->
    <!-- Right Acanthus Spray connecting toward next flower -->
    <g id="acanthus-spray-right">
      <!-- Main stem vine -->
      <path d="M 138,60 C 155,60 170,55 190,58 C 205,60 220,60 240,60" fill="none" stroke="#DEC28A" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 140,61 C 155,61 170,57 190,59.5 C 205,61.5 220,61 240,61" fill="none" stroke="#9E8048" stroke-width="0.8" />

      <!-- Top flaring acanthus leaf lobes -->
      <path d="M 145,59 C 148,50 158,45 166,46 C 168,48 165,54 158,56 C 153,57 149,58 145,59 Z" fill="url(#gold-petal)" stroke="#8F723B" stroke-width="0.7" />
      <path d="M 152,58 C 158,47 172,42 181,45 C 183,48 178,53 171,55 C 165,56 158,57 152,58 Z" fill="url(#gold-petal)" stroke="#8F723B" stroke-width="0.7" />
      <path d="M 166,57 C 174,48 188,44 196,48 C 197,50 193,54 186,56 C 179,57 172,57 166,57 Z" fill="url(#gold-petal)" stroke="#8F723B" stroke-width="0.7" />
      <path d="M 182,57 C 191,51 202,48 210,51 C 211,53 207,56 201,57 C 195,58 188,58 182,57 Z" fill="url(#gold-petal)" stroke="#8F723B" stroke-width="0.7" />

      <!-- Bottom flaring acanthus leaf lobes -->
      <path d="M 145,61 C 148,70 158,75 166,74 C 168,72 165,66 158,64 C 153,63 149,62 145,61 Z" fill="url(#gold-petal)" stroke="#8F723B" stroke-width="0.7" />
      <path d="M 152,62 C 158,73 172,78 181,75 C 183,72 178,67 171,65 C 165,64 158,63 152,62 Z" fill="url(#gold-petal)" stroke="#8F723B" stroke-width="0.7" />
      <path d="M 166,63 C 174,72 188,76 196,72 C 197,70 193,66 186,64 C 179,63 172,63 166,63 Z" fill="url(#gold-petal)" stroke="#8F723B" stroke-width="0.7" />
      <path d="M 182,63 C 191,69 202,72 210,69 C 211,67 207,64 201,63 C 195,62 188,62 182,63 Z" fill="url(#gold-petal)" stroke="#8F723B" stroke-width="0.7" />

      <!-- Center terminal rosette bud at x=240 -->
      <circle cx="240" cy="60" r="3" fill="#F4E2BE" stroke="#8F723B" stroke-width="0.8" />
    </g>

    <!-- Left Acanthus Spray (Mirrored horizontally around x=120) -->
    <use href="#acanthus-spray-right" transform="translate(240, 0) scale(-1, 1)" />

    <!-- Full 240px Repeating Pattern Unit -->
    <pattern id="greek-key-floral-pattern" width="240" height="120" patternUnits="userSpaceOnUse">
      <!-- Solid Rich Charcoal/Black Fabric Background -->
      <rect x="0" y="0" width="240" height="120" fill="#121011" />

      <!-- Top Solid Gold Rail (height 7px) -->
      <rect x="0" y="0" width="240" height="7" fill="url(#gold-rail)" />
      <line x1="0" y1="7" x2="240" y2="7" stroke="#80652F" stroke-width="0.8" />

      <!-- Upper Greek Key Fret Band (12 fret units across 240px) -->
      <use href="#greek-fret" x="0" y="10" />
      <use href="#greek-fret" x="20" y="10" />
      <use href="#greek-fret" x="40" y="10" />
      <use href="#greek-fret" x="60" y="10" />
      <use href="#greek-fret" x="80" y="10" />
      <use href="#greek-fret" x="100" y="10" />
      <use href="#greek-fret" x="120" y="10" />
      <use href="#greek-fret" x="140" y="10" />
      <use href="#greek-fret" x="160" y="10" />
      <use href="#greek-fret" x="180" y="10" />
      <use href="#greek-fret" x="200" y="10" />
      <use href="#greek-fret" x="220" y="10" />
      <!-- Upper Divider Line -->
      <line x1="0" y1="31" x2="240" y2="31" stroke="#DEC28A" stroke-width="1.4" />
      <line x1="0" y1="33" x2="240" y2="33" stroke="#7E6230" stroke-width="0.8" />

      <!-- Center Band Motif: Acanthus Leaf Vine + Center Flower Blossom -->
      <use href="#acanthus-spray-right" />
      <use href="#acanthus-spray-right" transform="translate(240, 0) scale(-1, 1)" />
      <use href="#blossom" />

      <!-- Lower Divider Line -->
      <line x1="0" y1="87" x2="240" y2="87" stroke="#7E6230" stroke-width="0.8" />
      <line x1="0" y1="89" x2="240" y2="89" stroke="#DEC28A" stroke-width="1.4" />

      <!-- Lower Greek Key Fret Band (12 fret units across 240px) -->
      <use href="#greek-fret" x="0" y="92" />
      <use href="#greek-fret" x="20" y="92" />
      <use href="#greek-fret" x="40" y="92" />
      <use href="#greek-fret" x="60" y="92" />
      <use href="#greek-fret" x="80" y="92" />
      <use href="#greek-fret" x="100" y="92" />
      <use href="#greek-fret" x="120" y="92" />
      <use href="#greek-fret" x="140" y="92" />
      <use href="#greek-fret" x="160" y="92" />
      <use href="#greek-fret" x="180" y="92" />
      <use href="#greek-fret" x="200" y="92" />
      <use href="#greek-fret" x="220" y="92" />
      <!-- Bottom Solid Gold Rail (height 7px) -->
      <line x1="0" y1="113" x2="240" y2="113" stroke="#80652F" stroke-width="0.8" />
      <rect x="0" y="113" width="240" height="7" fill="url(#gold-rail)" />
    </pattern>
  </defs>

  <rect width="100%" height="120" fill="url(#greek-key-floral-pattern)" />
</svg>