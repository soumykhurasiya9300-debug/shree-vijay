<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Cross floret for upper and lower lattice rails -->
    <g id="cross-floret">
      <path d="M-2,-5 H2 V-2 H5 V2 H2 V5 H-2 V2 H-5 V-2 H-2 Z" fill="#F3DEC0" />
      <circle cx="-3.5" cy="-3.5" r="0.8" fill="#F3DEC0" />
      <circle cx="3.5" cy="-3.5" r="0.8" fill="#F3DEC0" />
      <circle cx="-3.5" cy="3.5" r="0.8" fill="#F3DEC0" />
      <circle cx="3.5" cy="3.5" r="0.8" fill="#F3DEC0" />
    </g>

    <!-- Small blooming rosette -->
    <g id="small-rosette">
      <circle cx="0" cy="0" r="2.5" fill="#F3DEC0" />
      <ellipse cx="0" cy="-5.5" rx="1.8" ry="2.8" fill="#F3DEC0" />
      <ellipse cx="4" cy="-4" rx="1.8" ry="2.8" transform="rotate(45, 4, -4)" fill="#F3DEC0" />
      <ellipse cx="5.5" cy="0" rx="1.8" ry="2.8" transform="rotate(90, 5.5, 0)" fill="#F3DEC0" />
      <ellipse cx="4" cy="4" rx="1.8" ry="2.8" transform="rotate(135, 4, 4)" fill="#F3DEC0" />
      <ellipse cx="0" cy="5.5" rx="1.8" ry="2.8" fill="#F3DEC0" />
      <ellipse cx="-4" cy="4" rx="1.8" ry="2.8" transform="rotate(225, -4, 4)" fill="#F3DEC0" />
      <ellipse cx="-5.5" cy="0" rx="1.8" ry="2.8" transform="rotate(270, -5.5, 0)" fill="#F3DEC0" />
      <ellipse cx="-4" cy="-4" rx="1.8" ry="2.8" transform="rotate(315, -4, -4)" fill="#F3DEC0" />
      <circle cx="0" cy="0" r="1.2" fill="#841720" />
    </g>

    <!-- Central Swirling Medallion Unit (120px wide) -->
    <g id="medallion-unit">
      <!-- Center Rosette -->
      <circle cx="60" cy="60" r="10" fill="#841720" stroke="#F3DEC0" stroke-width="1.4" />
      <circle cx="60" cy="60" r="3.5" fill="#F3DEC0" />
      <!-- 8 Petals -->
      <path d="M60,51 Q58,56 60,60 Q62,56 60,51" fill="#F3DEC0" />
      <path d="M60,69 Q58,64 60,60 Q62,64 60,69" fill="#F3DEC0" />
      <path d="M51,60 Q56,58 60,60 Q56,62 51,60" fill="#F3DEC0" />
      <path d="M69,60 Q64,58 60,60 Q64,62 69,60" fill="#F3DEC0" />
      <path d="M53.5,53.5 Q57,56 60,60 Q56,57 53.5,53.5" fill="#F3DEC0" />
      <path d="M66.5,66.5 Q63,64 60,60 Q64,63 66.5,66.5" fill="#F3DEC0" />
      <path d="M66.5,53.5 Q63,56 60,60 Q64,57 66.5,53.5" fill="#F3DEC0" />
      <path d="M53.5,66.5 Q57,64 60,60 Q56,63 53.5,66.5" fill="#F3DEC0" />

      <!-- Concentric Beaded and Solid Rings -->
      <circle cx="60" cy="60" r="14" fill="none" stroke="#F3DEC0" stroke-width="1" stroke-dasharray="1.5 1.5" />
      <circle cx="60" cy="60" r="16.5" fill="none" stroke="#F3DEC0" stroke-width="1.2" />
      <circle cx="60" cy="60" r="19" fill="none" stroke="#F3DEC0" stroke-width="1" stroke-dasharray="2 1.5" />

      <!-- Sweeping clockwise spiral swirl arc -->
      <path d="M41,52 C38,42 47,33 60,33 C72,33 82,41 82,52 C82,58 79,63 76,66" fill="none" stroke="#F3DEC0" stroke-width="2" stroke-linecap="round" />
      <path d="M38,55 C35,43 45,30 61,30 C76,30 86,40 86,52 C86,59 82,65 78,69" fill="none" stroke="#F3DEC0" stroke-width="1" stroke-linecap="round" />

      <!-- Radiating crest feather leaves -->
      <path d="M46,38 C44,34 40,32 37,34 C34,36 35,40 39,43 Z" fill="#F3DEC0" />
      <path d="M53,35 C52,31 49,29 45,30 C42,32 43,36 47,39 Z" fill="#F3DEC0" />
      <path d="M61,34 C61,30 58,28 55,29 C52,30 52,34 56,37 Z" fill="#F3DEC0" />
      <path d="M69,35 C70,31 68,28 65,28 C62,30 62,34 65,37 Z" fill="#F3DEC0" />
      <path d="M77,38 C79,35 78,32 75,31 C72,32 71,36 74,39 Z" fill="#F3DEC0" />
      <path d="M83,44 C86,41 86,38 84,36 C81,36 79,39 81,43 Z" fill="#F3DEC0" />
      <path d="M87,51 C91,49 92,46 90,44 C87,43 85,46 86,50 Z" fill="#F3DEC0" />
      <path d="M88,59 C92,58 94,55 92,53 C90,52 87,54 87,58 Z" fill="#F3DEC0" />
      <path d="M87,67 C91,67 93,64 92,62 C90,60 87,62 86,66 Z" fill="#F3DEC0" />
      <path d="M84,74 C87,76 90,74 90,72 C88,69 85,70 83,73 Z" fill="#F3DEC0" />

      <!-- Lower left curve flourish petals -->
      <path d="M41,57 C37,55 34,57 34,60 C35,63 38,62 41,60 Z" fill="#F3DEC0" />
      <path d="M41,65 C37,65 35,68 36,71 C38,73 41,71 42,68 Z" fill="#F3DEC0" />
      <path d="M43,72 C41,74 39,78 41,80 C44,81 46,78 46,75 Z" fill="#F3DEC0" />
      <path d="M48,78 C46,81 46,84 49,85 C51,85 53,82 52,79 Z" fill="#F3DEC0" />
      <path d="M54,82 C53,85 54,88 57,89 C59,88 60,85 58,83 Z" fill="#F3DEC0" />

      <!-- Intermediary rosettes -->
      <use href="#small-rosette" x="0" y="38" />
      <use href="#small-rosette" x="0" y="82" />
    </g>

    <!-- Repeating 120px Pattern -->
    <pattern id="indian-border-pattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Rich Crimson Maroon Background -->
      <rect x="0" y="0" width="120" height="120" fill="#841720" />

      <!-- Top Border Band -->
      <line x1="0" y1="2" x2="120" y2="2" stroke="#F3DEC0" stroke-width="1.4" />
      <line x1="0" y1="4.5" x2="120" y2="4.5" stroke="#F3DEC0" stroke-width="0.8" />
      <use href="#cross-floret" x="7.5" y="10" />
      <use href="#cross-floret" x="7.5" y="17" />
      <use href="#cross-floret" x="22.5" y="10" />
      <use href="#cross-floret" x="22.5" y="17" />
      <use href="#cross-floret" x="37.5" y="10" />
      <use href="#cross-floret" x="37.5" y="17" />
      <use href="#cross-floret" x="52.5" y="10" />
      <use href="#cross-floret" x="52.5" y="17" />
      <use href="#cross-floret" x="67.5" y="10" />
      <use href="#cross-floret" x="67.5" y="17" />
      <use href="#cross-floret" x="82.5" y="10" />
      <use href="#cross-floret" x="82.5" y="17" />
      <use href="#cross-floret" x="97.5" y="10" />
      <use href="#cross-floret" x="97.5" y="17" />
      <use href="#cross-floret" x="112.5" y="10" />
      <use href="#cross-floret" x="112.5" y="17" />
      <line x1="0" y1="23.5" x2="120" y2="23.5" stroke="#F3DEC0" stroke-width="1.2" />
      <line x1="0" y1="25.5" x2="120" y2="25.5" stroke="#F3DEC0" stroke-width="0.6" />

      <!-- Central Swirling Medallion Unit -->
      <use href="#medallion-unit" x="0" y="0" />

      <!-- Bottom Border Band -->
      <line x1="0" y1="94.5" x2="120" y2="94.5" stroke="#F3DEC0" stroke-width="0.6" />
      <line x1="0" y1="96.5" x2="120" y2="96.5" stroke="#F3DEC0" stroke-width="1.2" />
      <use href="#cross-floret" x="7.5" y="103" />
      <use href="#cross-floret" x="7.5" y="110" />
      <use href="#cross-floret" x="22.5" y="103" />
      <use href="#cross-floret" x="22.5" y="110" />
      <use href="#cross-floret" x="37.5" y="103" />
      <use href="#cross-floret" x="37.5" y="110" />
      <use href="#cross-floret" x="52.5" y="103" />
      <use href="#cross-floret" x="52.5" y="110" />
      <use href="#cross-floret" x="67.5" y="103" />
      <use href="#cross-floret" x="67.5" y="110" />
      <use href="#cross-floret" x="82.5" y="103" />
      <use href="#cross-floret" x="82.5" y="110" />
      <use href="#cross-floret" x="97.5" y="103" />
      <use href="#cross-floret" x="97.5" y="110" />
      <use href="#cross-floret" x="112.5" y="103" />
      <use href="#cross-floret" x="112.5" y="110" />
      <line x1="0" y1="115.5" x2="120" y2="115.5" stroke="#F3DEC0" stroke-width="0.8" />
      <line x1="0" y1="118" x2="120" y2="118" stroke="#F3DEC0" stroke-width="1.4" />
    </pattern>
  </defs>

  <rect width="100%" height="120" fill="url(#indian-border-pattern)" />
</svg>